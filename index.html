<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhiaren R. Asuncion - Digital Business Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a0f;
            --card-bg: #091016;
            --accent-blue: #00d2ff;
            --glow-blue: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #94b2cc;
            --pill-bg: #111e29;
            --pill-border: #182c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 50%, #061c2d 0%, #03060a 100%);
        }

        /* Fixed Single Position Container */
        .card-container {
            width: 340px;
            height: 600px;
            perspective: 1000px;
            position: relative;
        }

        /* Inner 3D Wrapper */
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Flipped Class Controlled via JS Click on the bottom button */
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Shared Styling for Front & Back Sides */
        .card-side {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 28px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 210, 255, 0.15);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Subtle Corner Glow */
        .card-side::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--glow-blue) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* FRONT CARD */
        .card-front {
            z-index: 2;
            align-items: center;
            text-align: center;
        }

        /* Clickable Share Button */
        .share-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.1);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-top: 10px;
            margin-bottom: 14px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 180deg, var(--accent-blue), transparent, var(--accent-blue));
            box-shadow: 0 0 20px var(--glow-blue);
            cursor: pointer;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a2a3a;
        }

        /* Small Camera Badge Icon */
        .camera-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 28px;
            height: 28px;
            background-color: var(--pill-bg);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            box-shadow: 0 0 8px var(--glow-blue);
            transition: all 0.2s ease;
        }

        .avatar-container:hover .camera-badge {
            background-color: var(--accent-blue);
            color: #000;
            transform: scale(1.1);
        }

        .name-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .verified-badge {
            color: var(--accent-blue);
            font-size: 1rem;
        }

        .role {
            color: var(--accent-blue);
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .bio {
            color: var(--text-sub);
            font-size: 0.82rem;
            line-height: 1.4;
            margin-bottom: 16px;
            padding: 0 10px;
        }

        .social-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            width: 100%;
            justify-content: center;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .action-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #000;
            box-shadow: 0 4px 15px var(--glow-blue);
        }

        .btn-primary .arrow {
            margin-left: auto;
        }

        .btn-secondary {
            background-color: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: #fff;
        }

        /* BACK CARD */
        .card-back {
            transform: rotateY(180deg);
            align-items: center;
            justify-content: space-between;
        }

        .back-header {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: var(--accent-blue);
            margin-top: 5px;
            text-align: center;
        }

        .qr-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 15px var(--glow-blue);
            margin: 5px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-code {
            width: 120px;
            height: 120px;
        }

        .qr-subtext {
            color: var(--text-sub);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-pill {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            border-radius: 25px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.82rem;
            transition: all 0.2s ease;
        }

        .info-pill:hover {
            border-color: var(--accent-blue);
        }

        .info-pill i {
            color: var(--accent-blue);
            font-size: 1rem;
            width: 16px;
            text-align: center;
        }

        .info-pill span {
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .motto {
            font-family: 'Caveat', cursive;
            color: var(--text-sub);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 5px;
        }

        /* Flip Toggle Control Button Below Card */
        .flip-control-btn {
            margin-top: 20px;
            background: var(--pill-bg);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            transition: all 0.2s ease;
        }

        .flip-control-btn:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px var(--glow-blue);
        }
    </style>
</head>
<body>

    <!-- Single Position Container -->
    <div class="card-container" id="cardContainer">
        <div class="card-inner">
            
            <!-- FRONT SIDE -->
            <div class="card-side card-front">
                <!-- Working Clickable Share Button -->
                <button class="share-btn" onclick="shareCard(event)" title="Share Card">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
                
                <!-- Profile Picture set directly to Rhia Asuncion.png -->
                <div class="avatar-container" onclick="triggerPhotoUpload()" title="Click to change photo">
                    <img id="profileImg" src="Rhia Asuncion.png" alt="Rhiaren R. Asuncion" class="avatar-img">
                    <div class="camera-badge">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <!-- Hidden file input for photo upload -->
                <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="uploadPhoto(event)">

                <div class="name-title">
                    RHIAREN R. ASUNCION <i class="fa-solid fa-circle-check verified-badge"></i>
                </div>
                <div class="role">Barista / Social Media Manager / Graphic Artist</div>
                
                <p class="bio">Crafting experiences, managing brands, and creating visuals.</p>

                <div class="social-grid">
                    <a href="https://m.me/rix.rayray" target="_blank" class="social-btn" title="Messenger">
                        <i class="fa-brands fa-facebook-messenger"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/rhiaren-asuncion-0b41b0252" target="_blank" class="social-btn" title="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>

                <a href="mailto:rhiarenasuncion12@gmail.com" class="action-btn btn-primary">
                    <i class="fa-solid fa-envelope"></i> Contact Me <i class="fa-solid fa-arrow-right arrow"></i>
                </a>

                <button class="action-btn btn-secondary" onclick="downloadVCard()">
                    <i class="fa-solid fa-download"></i> Save Contact
                </button>
            </div>

            <!-- BACK SIDE -->
            <div class="card-side card-back">
                <div class="back-header">Let's Connect</div>

                <div class="qr-container">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AAsuncion%3BRhiaren%0AFN%3ARhiaren+R.+Asuncion%0ATITLE%3ABarista+%2F+Social+Media+Manager+%2F+Graphic+Artist%0ATEL%3A09078506927%0AEMAIL%3Arhiarenasuncion12%40gmail.com%0AADR%3A%3B%3BAguso%3BTarlac+City%0AEND%3AVCARD" alt="QR Code" class="qr-code">
                </div>
                <div class="qr-subtext">Scan to Save Contact</div>

                <div class="info-list">
                    <a href="tel:09078506927" class="info-pill">
                        <i class="fa-solid fa-phone"></i>
                        <span>09078506927</span>
                    </a>
                    <a href="mailto:rhiarenasuncion12@gmail.com" class="info-pill">
                        <i class="fa-solid fa-envelope"></i>
                        <span>rhiarenasuncion12@gmail.com</span>
                    </a>
                    <a href="https://maps.app.goo.gl/ZRYKzEWYc2iMYm1S7" target="_blank" class="info-pill" title="Open Google Maps">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Aguso Tarlac City</span>
                    </a>
                </div>

                <div class="motto">Create • Connect • Inspire</div>
            </div>

        </div>
    </div>

    <!-- Exclusive Flip Button Below Card -->
    <button class="flip-control-btn" id="flipBtn" onclick="toggleCard()">
        <i class="fa-solid fa-rotate"></i> <span id="btnText">Click to Show Back</span>
    </button>

    <script>
        const cardContainer = document.getElementById('cardContainer');
        const btnText = document.getElementById('btnText');
        const profileImg = document.getElementById('profileImg');
        const photoInput = document.getElementById('photoInput');

        // Load saved photo from localStorage if present
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhoto = localStorage.getItem('rhiaren_card_photo');
            if (savedPhoto) {
                profileImg.src = savedPhoto;
            }
        });

        // Trigger file input when camera icon / avatar is clicked
        function triggerPhotoUpload() {
            photoInput.click();
        }

        // Process uploaded image and save locally
        function uploadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImg.src = e.target.result;
                    localStorage.setItem('rhiaren_card_photo', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        // Click handler to toggle flip
        function toggleCard() {
            cardContainer.classList.toggle('flipped');
            if (cardContainer.classList.contains('flipped')) {
                btnText.textContent = "Click to Show Front";
            } else {
                btnText.textContent = "Click to Show Back";
            }
        }

        // Share button function
        function shareCard(event) {
            const siteUrl = window.location.href;

            if (navigator.share) {
                navigator.share({
                    title: 'Rhiaren R. Asuncion - Digital Business Card',
                    text: 'Check out Rhiaren R. Asuncion\'s Digital Business Card!',
                    url: siteUrl
                }).catch((err) => console.log('Error sharing:', err));
            } else {
                navigator.clipboard.writeText(siteUrl).then(() => {
                    alert('Link copied to clipboard:\n' + siteUrl);
                }).catch(() => {
                    prompt('Copy this link:', siteUrl);
                });
            }
        }

        // Function to download vCard (.vcf file)
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Rhiaren R. Asuncion
TITLE:Barista / Social Media Manager / Graphic Artist
TEL;TYPE=CELL:09078506927
EMAIL:rhiarenasuncion12@gmail.com
ADR;TYPE=HOME:;;Aguso;Tarlac City;;;
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Rhiaren_Asuncion_Contact.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
